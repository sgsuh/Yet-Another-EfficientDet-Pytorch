project_name: ad  # also the folder name of the dataset that under data_path folder
train_set: train2017
val_set: val2017
num_gpus: 1

# mean and std in RGB order, actually this part should remain unchanged as long as your dataset is similar to coco.
mean: [0.406, 0.456, 0.485]
std: [0.225, 0.224, 0.229]

# this is coco anchors, change it if necessary
anchors_scales: '[0.25,0.5,2 ** 0, 2 ** (1.0 / 3.0), 2 ** (2.0 / 3.0)]'
anchors_ratios: '[(1.0,4.0),(1.0,2.0),(1.0, 1.0),(2.0,1.0),(4.0, 1.0)]'

# must match your dataset's category_id.
# category_id is one_indexed,
# for example, index of 'car' here is 2, while category_id of is 3
obj_list: ['traffic light', 'pedestrian', 'car', 'cyclist']
